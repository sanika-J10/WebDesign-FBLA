
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community Events | CommonGround</title>
  <link rel="stylesheet" href="style.css">
  <script src="data.js" defer></script>
  <script src="app.js" defer></script>
  <script src="events.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="site-header">
    <nav class="container nav" aria-label="Main navigation">
      <a class="brand" href="index.html">Common<span>Ground</span></a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="resources.html">Explore</a>
        <a href="events.html" aria-current="page">Events</a>
        <a href="saved.html">Saved</a>
      </div>
    </nav>
  </header>

  <main id="main" class="container section">
    <p class="eyebrow">HAPPENING LOCALLY</p>
    <h1>Make room for community.</h1>
    <p>Discover programs, activities, and opportunities to participate.</p>

    <section class="filter-panel" aria-label="Event filters">
      <label for="event-query">Search events</label>
      <input id="event-query" type="search"
        placeholder="Search by event name or topic">

      <div class="filter-grid">
        <div>
          <label for="event-category">Category</label>
          <select id="event-category">
            <option value="">All categories</option>
            <option value="Education">Education</option>
            <option value="Volunteering">Volunteering</option>
            <option value="Recreation">Recreation</option>
          </select>
        </div>

        <div>
          <label for="event-city">Location</label>
          <select id="event-city">
            <option value="">All locations</option>
            <option value="Cumming">Cumming</option>
            <option value="Alpharetta">Alpharetta</option>
          </select>
        </div>
      </div>
    </section>

    <p id="event-count" aria-live="polite"></p>
    <div id="event-results" class="resource-grid"></div>
  </main>

  <footer class="site-footer">
    <div class="container footer-content">
      <a class="brand brand-footer" href="index.html">Common<span>Ground</span></a>
      <p>An independent student-created community directory.</p>
    </div>
  </footer>
</body>
</html>
